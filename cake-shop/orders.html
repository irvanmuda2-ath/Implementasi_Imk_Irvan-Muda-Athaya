<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Pesanan Saya</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
background:#f5f5f5;
font-family:Poppins;
}

.page-container{
width:900px;
margin:40px auto;
}

.page-title{
font-size:35px;
margin-bottom:30px;
color:#c98b98;
}

.order-card{
background:white;
padding:25px;
border-radius:25px;
margin-bottom:25px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
display:flex;
justify-content:space-between;
align-items:center;
}

.order-left{
display:flex;
gap:20px;
align-items:center;
}

.order-left img{
width:120px;
height:120px;
object-fit:cover;
border-radius:20px;
}

.order-info h2{
margin-bottom:10px;
}

.order-info p{
margin-top:8px;
color:#666;
}

.status{
padding:8px 15px;
border-radius:20px;
font-size:14px;
font-weight:bold;
display:inline-block;
margin-top:10px;
}

.proses{
background:#fff3cd;
color:#856404;
}

.selesai{
background:#d4edda;
color:#155724;
}

.total-box{
background:white;
padding:25px;
border-radius:25px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
margin-top:30px;
}

.total-box h2{
color:#c98b98;
margin-top:15px;
}

.back-btn{
padding:14px 20px;
border:none;
border-radius:15px;
background:#c98b98;
color:white;
font-size:16px;
cursor:pointer;
margin-top:30px;
}

</style>

</head>

<body>

<div class="page-container">

<h1 class="page-title">
🛒 Pesanan Saya
</h1>

<div id="orders"></div>

<div class="total-box">

<p>Total Semua Pesanan</p>

<h2 id="grandTotal">
Rp 0
</h2>

</div>

<a href="index.html">

<button class="back-btn">
← Kembali ke Beranda
</button>

</a>

</div>

<script>

let orders =
JSON.parse(localStorage.getItem('orders')) || [];

let total = 0;

let html='';

orders.forEach((item,index)=>{

total += item.harga;

let gambar='assets/images/tiramisu.jpeg';

if(item.nama == 'Birthday Cake'){

gambar='assets/images/birthday.jpeg';

}

if(item.nama == 'Donut'){

gambar='assets/images/donut.jpeg';

}

let status =
index % 2 == 0
?
'<span class="status proses">Sedang Diproses</span>'
:
'<span class="status selesai">Selesai</span>';

html += `

<div class="order-card">

<div class="order-left">

<img src="${gambar}">

<div class="order-info">

<h2>${item.nama}</h2>

<p>Harga : Rp ${item.harga.toLocaleString()}</p>

<p>Metode Pembayaran :
${localStorage.getItem('payment')}
</p>

${status}

</div>

</div>

</div>

`;

});

if(orders.length == 0){

html = `

<div class="order-card">

<div class="order-info">

<h2>Belum Ada Pesanan</h2>

<p>
Silahkan lakukan pembelian terlebih dahulu
</p>

</div>

</div>

`;

}

document.getElementById('orders')
.innerHTML = html;

document.getElementById('grandTotal')
.innerHTML =
'Rp ' + total.toLocaleString();

</script>

</body>
</html>
