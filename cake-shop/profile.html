<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Profile Customer</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
background:#f5f5f5;
font-family:Poppins;
}

.page-container{
width:950px;
margin:40px auto;
}

.page-title{
font-size:38px;
color:#c98b98;
margin-bottom:30px;
}

.profile-card{
background:white;
border-radius:30px;
padding:35px;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
display:flex;
gap:40px;
align-items:center;
margin-bottom:35px;
}

.profile-left{
text-align:center;
}

.profile-img{
width:180px;
height:180px;
border-radius:50%;
object-fit:cover;
border:6px solid #f8dfe5;
margin-bottom:20px;
}

.upload-box{
margin-top:10px;
}

.upload-box input{
padding:10px;
}

.profile-right{
flex:1;
}

.profile-right h2{
font-size:35px;
margin-bottom:20px;
}

.member-badge{
display:inline-block;
background:#f8dfe5;
color:#c98b98;
padding:10px 18px;
border-radius:20px;
font-weight:bold;
margin-bottom:25px;
}

.profile-info{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.info-card{
background:#fafafa;
padding:20px;
border-radius:18px;
border:1px solid #eee;
}

.info-card h4{
color:#999;
margin-bottom:10px;
font-size:14px;
}

.info-card p{
font-size:17px;
font-weight:600;
}

.section-title{
font-size:30px;
margin-bottom:20px;
color:#c98b98;
}

.history-card{
background:white;
padding:25px;
border-radius:25px;
margin-bottom:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.06);
display:flex;
justify-content:space-between;
align-items:center;
}

.history-left{
display:flex;
gap:20px;
align-items:center;
}

.history-left img{
width:100px;
height:100px;
object-fit:cover;
border-radius:20px;
}

.history-info h3{
margin-bottom:10px;
font-size:24px;
}

.history-info p{
margin-top:5px;
color:#666;
}

.status{
padding:10px 18px;
border-radius:20px;
font-weight:bold;
font-size:14px;
}

.selesai{
background:#d4edda;
color:#155724;
}

.back-btn{
padding:15px 22px;
border:none;
border-radius:15px;
background:#c98b98;
color:white;
font-size:16px;
cursor:pointer;
margin-top:15px;
}

.back-btn:hover{
background:#b06d7d;
}

</style>

</head>

<body>

<div class="page-container">

<h1 class="page-title">
👤 Profile Customer
</h1>

<!-- PROFILE -->

<div class="profile-card">

<div class="profile-left">

<img src="assets/images/profile-default.jpeg"
class="profile-img"
id="preview">

<div class="upload-box">

<input type="file" id="foto">

</div>

</div>

<div class="profile-right">

<h2 id="namaUser">
Jisoo
</h2>

<div class="member-badge">
👑 Premium Customer
</div>

<div class="profile-info">

<div class="info-card">

<h4>Email</h4>

<p>
jisoo@gmail.com
</p>

</div>

<div class="info-card">

<h4>No Handphone</h4>

<p>
08123456789
</p>

</div>

<div class="info-card">

<h4>Alamat</h4>

<p>
Cianjur, Jawa Barat
</p>

</div>

<div class="info-card">

<h4>Status Akun</h4>

<p>
Aktif
</p>

</div>

</div>

</div>

</div>

<!-- HISTORY -->

<h2 class="section-title">
🛒 Riwayat Pembelian
</h2>

<div id="history"></div>

<a href="index.html">

<button class="back-btn">
← Kembali ke Beranda
</button>

</a>

</div>

<script>

document.getElementById('namaUser')
.innerHTML =
localStorage.getItem('username');

let orders =
JSON.parse(localStorage.getItem('orders')) || [];

let html='';

orders.forEach(item=>{

let gambar='assets/images/tiramisu.jpeg';

if(item.nama == 'Birthday Cake'){

gambar='assets/images/birthday.jpeg';

}

if(item.nama == 'Donut'){

gambar='assets/images/donut.jpeg';

}

html += `

<div class="history-card">

<div class="history-left">

<img src="${gambar}">

<div class="history-info">

<h3>${item.nama}</h3>

<p>
Harga :
Rp ${item.harga.toLocaleString()}
</p>

<p>
Tanggal :
19 Mei 2026
</p>

</div>

</div>

<div class="status selesai">
Selesai
</div>

</div>

`;

});

document.getElementById('history')
.innerHTML = html;

document.getElementById('foto')
.addEventListener('change',function(e){

const file = e.target.files[0];

const reader = new FileReader();

reader.onload=function(){

document.getElementById('preview')
.src = reader.result;

localStorage.setItem(
'profile',
reader.result
);

}

reader.readAsDataURL(file);

});

if(localStorage.getItem('profile')){

document.getElementById('preview')
.src =
localStorage.getItem('profile');

}

</script>

</body>
</html>
